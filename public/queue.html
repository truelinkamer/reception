<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Get your token – True Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231c;--mute:#5b6a62;--line:#dde3df;--green:#0b6b3a;--red:#b3202a;--okbg:#e2f0e6;--redbg:#fbe8e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--ink:#eef3f0;--mute:#9baba2;--line:#2a3730;--okbg:#17301f;--redbg:#3a1b1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:16px}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
body.lock{overflow:hidden}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 28px}
header{display:grid;grid-template-columns:90px 1fr 90px;align-items:center;gap:12px;text-align:center}
header img{max-width:100%;max-height:70px;justify-self:center;background:#fff;border-radius:8px;padding:2px}
header h1{font-size:17px;margin:6px 0;line-height:1.3}
.tag{font-size:11px;letter-spacing:.2em;color:var(--mute)}
.bar{display:flex;gap:6px;justify-content:center;margin:8px 0}.bar i{width:32px;height:3px;background:#d4202c}.bar i:nth-child(2){background:#111}.bar i:nth-child(3){background:#0b8a4a}
.note{font-size:12px;color:var(--mute)}
.top{display:flex;justify-content:flex-end}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;color:var(--ink);padding:5px 14px;font:inherit;font-size:12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--card);font-weight:600}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mute);margin:0 0 20px}
label.l{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;padding:13px 14px}
.fld{margin-bottom:16px}
.in:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.send{background:var(--green);color:#fff;border:0;border-radius:10px;padding:14px 26px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.send.full{width:100%}.send[disabled]{opacity:.6;cursor:wait}
.send.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.msg{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--red);min-height:1em}
.hp{position:absolute;left:-9999px}
.notice{background:var(--redbg);color:var(--red);border-radius:10px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:18px}
.priv{font-size:12px;color:var(--mute);margin:14px 0 0;text-align:center}
.center{text-align:center}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--green);margin:6px auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tsmall{font:800 clamp(48px,16vw,84px)/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.04em;color:var(--green);background:var(--okbg);border-radius:16px;padding:16px 10px;margin:14px 0;white-space:nowrap;overflow:hidden}
.btns{display:grid;gap:10px;margin-top:16px}
/* ---- pop-ups ---- */
.ov{position:fixed;inset:0;background:rgba(6,18,12,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:50}
.ov[hidden]{display:none}
.dlg{background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:24px;overflow:hidden;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,.9,.3,1.2);margin:auto}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.stripe{display:flex;height:8px}.stripe i{flex:1;background:#d4202c}.stripe i:nth-child(2){background:#111}.stripe i:nth-child(3){background:#0b8a4a}
.dbody{padding:28px 26px 30px}
.dbody img{max-height:60px;background:#fff;border-radius:8px;padding:2px;margin-bottom:6px}
.co{font-size:12px;color:var(--mute);margin-bottom:18px}
.lbl{font-size:13px;letter-spacing:.28em;font-weight:700;color:var(--mute)}
.big{font:800 clamp(72px,24vw,168px)/1.05 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.04em;color:var(--green);background:var(--okbg);border:2px solid var(--green);border-radius:22px;padding:18px 8px;margin:12px 0 18px;white-space:nowrap;overflow:hidden}
.hello{font-size:20px;font-weight:700;margin:0 0 4px}
.dbody p{margin:0 0 6px}.dbody .mute{color:var(--mute)}
.exit{margin-top:20px;min-width:200px}
.rv h2{font-size:24px;margin:8px 0 6px}.rv .star{font-size:44px;line-height:1}
textarea,input.caps{text-transform:uppercase}
.in.caps::placeholder{text-transform:none}
.hint{font-size:12px;color:var(--mute);margin:6px 0 0}
.tk{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px;text-align:center}
.tk.ok{border-color:var(--green)}
.th{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-bottom:8px}.th b{color:var(--ink)}
.tw{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;color:var(--mute);font-weight:600}
.spin.s{width:20px;height:20px;border-width:3px;margin:0}
.tk .tsmall{font-size:clamp(40px,14vw,72px)}
.tk .send{margin-top:6px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.row2>*{flex:1;min-width:150px}
@media (prefers-reduced-motion:reduce){.dlg,.spin{animation:none}}
@media(max-width:560px){header{grid-template-columns:60px 1fr 60px}header img{max-height:50px}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="card">
    <img src="logo-amer.png" alt="Amer" onerror="this.style.visibility='hidden'">
    <div><div class="tag" data-i="tag"></div><h1>True Link Government<br>Transaction Center LLC</h1><div class="bar"><i></i><i></i><i></i></div></div>
    <img src="logo-truelink.png" alt="True Link" onerror="this.style.visibility='hidden'">
  </header>
  <div class="top"><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="ar" aria-pressed="false">العربية</button></div></div>

  <div class="notice" id="notice" role="status" hidden></div>

  <!-- Your tokens (one customer can have several) -->
  <section class="card" id="sTickets" hidden>
    <h2 data-i="yourTokens"></h2>
    <div id="tlist"></div>
    <div class="row2">
      <button class="send" type="button" id="another" data-i="another"></button>
      <a class="send ghost" id="fbLink" href="#" data-i="fbBtn"></a>
    </div>
  </section>

  <!-- Details form -->
  <main class="card" id="sForm">
    <h2 data-i="title"></h2><p class="sub" id="intro"></p>
    <form id="f" novalidate>
      <p class="hp"><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
      <div class="fld"><label class="l" for="name" data-i="name"></label><input class="in caps" id="name" name="name" maxlength="80" autocomplete="name" required></div>
      <div class="fld"><label class="l" for="phone" data-i="phone"></label><input class="in" id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" dir="ltr" placeholder="05XXXXXXXX" required><p class="hint" data-i="phoneHint"></p></div>
      <div class="fld"><label class="l" for="email" data-i="email"></label><input class="in caps" id="email" name="email" type="email" maxlength="120" autocomplete="email" dir="ltr" required></div>
      <p class="msg" id="err" role="alert"></p>
      <div class="row2" style="margin-top:0"><button class="send" type="submit" id="btn" data-i="send"></button><button class="send ghost" type="button" id="cancelForm" data-i="back" hidden></button></div>
      <p class="priv" data-i="priv"></p>
    </form>
  </main>
</div>

<!-- Big token pop-up -->
<div class="ov" id="mTk" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mTkL">
    <div class="stripe"><i></i><i></i><i></i></div>
    <div class="dbody">
      <img src="logo-truelink.png" alt="True Link" onerror="this.style.display='none'">
      <div class="co">True Link Government Transaction Center LLC</div>
      <div class="lbl" id="mTkL" data-i="yourToken"></div>
      <div class="big" id="mTok" dir="ltr" aria-live="polite"></div>
      <p class="hello" id="mHello"></p>
      <p class="mute" data-i="pleaseWait"></p>
      <p class="mute" id="mUntil" style="font-size:12px"></p>
      <button class="send exit" type="button" id="mExit" data-i="exit"></button>
    </div>
  </div>
</div>

<!-- Review pop-up (after exit) -->
<div class="ov" id="mRv" hidden>
  <div class="dlg rv" role="dialog" aria-modal="true" aria-labelledby="rvT">
    <div class="stripe"><i></i><i></i><i></i></div>
    <div class="dbody">
      <div class="star" aria-hidden="true">★</div>
      <h2 id="rvT" data-i="revT"></h2>
      <p class="mute" data-i="revD"></p>
      <div class="btns" style="margin-top:20px">
        <a class="send" id="rvGo" href="https://truelink-review.netlify.app/customer" data-i="revBtn"></a>
        <button class="send ghost" type="button" id="rvLater" data-i="later"></button>
      </div>
    </div>
  </div>
</div>

<script>
const REVIEW="https://truelink-review.netlify.app/customer",KEY="tlq2",SEEN="tlq2_seen",ME="tlq_me";
const T={
en:{tag:"TOKEN REQUEST",title:"Get your token",intro:"Enter your details. Reception will send your token number to this screen.",introMore:"Need another token? Your details are filled in. Check them and press Request token.",name:"Full name",phone:"Mobile number",phoneHint:"Starts with 05, 10 digits (example 0501234567)",email:"Email address",send:"Request token",sending:"Sending…",priv:"Your details are used only to issue your token.",err:"Could not send. Check your connection and try again.",eName:"Please enter your name.",ePhone:"Mobile number must start with 05 and have 10 digits.",eEmail:"Please enter a valid email address.",tooMany:"You already have several requests waiting. Please wait for reception.",yourTokens:"Your tokens",another:"Get another token",back:"Back",reqN:"Request {n}",waitS:"Waiting for reception…",showFull:"Show token full screen",fbBtn:"Share your feedback",yourToken:"YOUR TOKEN NUMBER",hello:"Hello {n}",pleaseWait:"Please take a seat. We will call your number shortly.",until:"You can reopen this token on this page until {t}.",exit:"Exit",revT:"Thank you for visiting us",revD:"We would love to hear about your experience today. It only takes a minute.",revBtn:"Write a review",later:"Not now",expired:"A token has expired and was removed from this page.",gone:"A request could not be found and was removed. Please submit your details again."},
ar:{tag:"طلب رقم دور",title:"احصل على رقم الدور",intro:"أدخل بياناتك وسيرسل الاستقبال رقم الدور إلى هذه الشاشة.",introMore:"تحتاج رقم دور آخر؟ بياناتك معبأة مسبقًا. راجعها واضغط «اطلب رقم الدور».",name:"الاسم الكامل",phone:"رقم الجوال",phoneHint:"يبدأ بـ 05 ويتكون من 10 أرقام (مثال 0501234567)",email:"البريد الإلكتروني",send:"اطلب رقم الدور",sending:"جارٍ الإرسال…",priv:"تُستخدم بياناتك فقط لإصدار رقم الدور.",err:"تعذّر الإرسال. تحقق من الاتصال وحاول مرة أخرى.",eName:"يرجى إدخال الاسم.",ePhone:"يجب أن يبدأ رقم الجوال بـ 05 ويتكون من 10 أرقام.",eEmail:"يرجى إدخال بريد إلكتروني صحيح.",tooMany:"لديك عدة طلبات قيد الانتظار. يرجى انتظار الاستقبال.",yourTokens:"أرقام دورك",another:"احصل على رقم دور آخر",back:"رجوع",reqN:"الطلب {n}",waitS:"بانتظار الاستقبال…",showFull:"عرض الرقم بملء الشاشة",fbBtn:"شاركنا رأيك",yourToken:"رقم دورك",hello:"مرحبًا {n}",pleaseWait:"يرجى الجلوس، وسننادي على رقمك قريبًا.",until:"يمكنك إعادة فتح الرقم في هذه الصفحة حتى {t}.",exit:"خروج",revT:"شكرًا لزيارتك",revD:"يسعدنا أن نسمع عن تجربتك اليوم. يستغرق الأمر دقيقة فقط.",revBtn:"اكتب تقييمك",later:"ليس الآن",expired:"انتهت صلاحية رقم دور وتمت إزالته من هذه الصفحة.",gone:"تعذّر العثور على طلب وتمت إزالته. يرجى إرسال بياناتك مرة أخرى."}};
const $=s=>document.querySelector(s),f=$("#f");
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dg=v=>String(v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
let lang="en",list=[],info={},off=0,timer=null,showForm=false,noticeKey="",noticeT=null,pending=[],cur=null;
const L=k=>T[lang][k];
const left=d=>Date.parse(d.visibleUntil)-(Date.now()+off);
const clock=iso=>new Date(iso).toLocaleTimeString(lang==="ar"?"ar-AE":"en-GB",{hour:"2-digit",minute:"2-digit"});
const save=()=>set(KEY,JSON.stringify(list.slice(0,20)));
const seen=()=>{try{return JSON.parse(get(SEEN)||"{}")}catch(e){return{}}};
const mark=(id,m)=>{const s=seen();s[id]=m;set(SEEN,JSON.stringify(s))};

/* one-line fit for token numbers */
function fit(el,max){const w=el.clientWidth-28;if(w<=0)return;el.style.fontSize=Math.max(32,Math.min(max,w/(Math.max(el.textContent.length,1)*.7)))+"px"}
function fitAll(){fit($("#mTok"),170);document.querySelectorAll(".tsmall").forEach(e=>fit(e,72))}
addEventListener("resize",fitAll);

function card(t,n){
  const d=info[t.id],head=`<div class="th"><b>${esc(L("reqN").replace("{n}",n))}</b><span>${clock(t.at)}</span></div>`;
  if(!d||d.status!=="issued")return `<div class="tk">${head}<div class="tw"><i class="spin s"></i><span>${esc(L("waitS"))}</span></div></div>`;
  return `<div class="tk ok">${head}<div class="tsmall" dir="ltr">${esc(d.token)}</div><p class="note">${esc(L("until").replace("{t}",clock(d.visibleUntil)))}</p><button class="send" type="button" data-show="${t.id}">${esc(L("showFull"))}</button></div>`;
}
function paint(){
  document.querySelectorAll("[data-i]").forEach(e=>{const v=L(e.dataset.i);if(v)e.textContent=v});
  const has=list.length>0;
  $("#sTickets").hidden=!has;$("#sForm").hidden=has&&!showForm;
  $("#another").hidden=showForm;$("#cancelForm").hidden=!has;
  $("#intro").textContent=L(has?"introMore":"intro");
  $("#notice").hidden=!noticeKey;$("#notice").textContent=noticeKey?L(noticeKey):"";
  const asc=[...list].sort((a,b)=>a.at.localeCompare(b.at)),num=Object.fromEntries(asc.map((t,i)=>[t.id,i+1]));
  $("#tlist").innerHTML=[...list].sort((a,b)=>b.at.localeCompare(a.at)).map(t=>card(t,num[t.id])).join("");
  if(cur&&!$("#mTk").hidden)fillModal();
  fitAll();
}
function setLang(l){
  lang=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  set("lang",l);paint();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
function notice(k){noticeKey=k;clearTimeout(noticeT);noticeT=setTimeout(()=>{noticeKey="";paint()},9000)}

/* pop-ups */
function fillModal(){
  const d=info[cur];if(!d)return;
  $("#mTok").textContent=d.token;$("#mHello").textContent=L("hello").replace("{n}",d.name||"");
  $("#mUntil").textContent=L("until").replace("{t}",clock(d.visibleUntil));
}
function openTok(id,auto){
  if(!info[id])return;cur=id;fillModal();
  $("#mTk").hidden=false;document.body.classList.add("lock");fitAll();$("#mExit").focus();
  if(auto&&navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}
}
function exitTok(){
  $("#mTk").hidden=true;cur=null;
  if(pending.length){openTok(pending.shift(),true);return}   // another token was issued meanwhile
  $("#mRv").hidden=false;$("#rvGo").focus();
}
function closeRv(){$("#mRv").hidden=true;if($("#mTk").hidden)document.body.classList.remove("lock")}
$("#mExit").onclick=exitTok;$("#rvLater").onclick=closeRv;
$("#tlist").addEventListener("click",e=>{const b=e.target.closest("[data-show]");if(b)openTok(b.dataset.show,false)});
addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#mTk").hidden)exitTok();else if(!$("#mRv").hidden)closeRv()});

/* state */
function remove(id,why){
  list=list.filter(t=>t.id!==id);delete info[id];pending=pending.filter(x=>x!==id);save();notice(why);
  if(cur===id){$("#mTk").hidden=true;cur=null;document.body.classList.remove("lock")}
}
function announce(id){
  if(!$("#mTk").hidden||!$("#mRv").hidden){if(!pending.includes(id)&&cur!==id)pending.push(id);return}
  openTok(id,true);
}
async function check(){
  clearTimeout(timer);if(!list.length)return;
  const rs=await Promise.all(list.map(async t=>{
    try{const r=await fetch("/api/queue/status?id="+encodeURIComponent(t.id),{cache:"no-store"});
      if(r.status===404)return{id:t.id,gone:true};if(!r.ok)return null;return{id:t.id,d:await r.json()}}catch(e){return null}}));
  rs.forEach(x=>{
    if(!x)return;if(x.gone)return remove(x.id,"gone");
    off=Date.parse(x.d.now)-Date.now();info[x.id]=x.d;
    if(x.d.status!=="issued")return;
    if(left(x.d)<=0)return remove(x.id,"expired");
    const m=x.id+x.d.issuedAt+x.d.token;
    if(seen()[x.id]!==m){mark(x.id,m);announce(x.id)}
  });
  paint();
  timer=setTimeout(check,list.some(t=>!info[t.id]||info[t.id].status!=="issued")?4000:30000);
}
setInterval(()=>{let ch=false;list.slice().forEach(t=>{const d=info[t.id];if(d&&d.status==="issued"&&left(d)<=0){remove(t.id,"expired");ch=true}});if(ch)paint()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&list.length)check()});

/* form */
function fillMe(){try{const m=JSON.parse(get(ME)||"null");if(m){f.name.value=m.name||"";f.phone.value=m.phone||"";f.email.value=m.email||""}}catch(e){}}
$("#phone").addEventListener("input",e=>{e.target.value=dg(e.target.value).slice(0,10)});
$("#another").onclick=()=>{showForm=true;fillMe();paint();$("#sForm").scrollIntoView({behavior:"smooth",block:"start"})};
$("#cancelForm").onclick=()=>{showForm=false;$("#err").textContent="";paint();scrollTo({top:0,behavior:"smooth"})};
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const err=$("#err"),btn=$("#btn");err.textContent="";
  const o={name:f.name.value.trim().toUpperCase(),phone:dg(f.phone.value),email:f.email.value.trim().toUpperCase(),bot:f["bot-field"].value,language:lang};
  if(!o.name){err.textContent=L("eName");return}
  if(!/^05\d{8}$/.test(o.phone)){err.textContent=L("ePhone");return}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email)){err.textContent=L("eEmail");return}
  btn.disabled=true;btn.textContent=L("sending");
  try{
    const r=await fetch("/api/queue/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});
    if(r.status===400){const j=await r.json().catch(()=>({}));err.textContent=L(j.field==="phone"?"ePhone":j.field==="email"?"eEmail":"eName");return}
    if(r.status===429){err.textContent=L("tooMany");return}
    if(!r.ok)throw 0;
    const {id}=await r.json();if(!id)throw 0;
    list.unshift({id,name:o.name,at:new Date().toISOString()});save();
    set(ME,JSON.stringify({name:o.name,phone:o.phone,email:o.email}));
    showForm=false;noticeKey="";f.reset();paint();check();scrollTo({top:0,behavior:"smooth"});
  }catch(x){err.textContent=L("err")}
  finally{btn.disabled=false;btn.textContent=L("send")}
});

/* start */
$("#fbLink").href=REVIEW;$("#rvGo").href=REVIEW;
try{const s=get("lang");lang=T[s]?s:"en"}catch(e){}
try{list=JSON.parse(get(KEY)||"[]");if(!Array.isArray(list))list=[]}catch(e){list=[]}
fillMe();setLang(lang);if(list.length)check();
</script>
</body>
</html>
