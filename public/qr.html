<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Token QR code – True Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14231c;--mute:#5b6a62;--line:#dde3df;--green:#0b6b3a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1512;--card:#17201b;--ink:#eef3f0;--mute:#9baba2;--line:#2a3730}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:16px;min-height:100vh}
.poster{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;text-align:center}
.stripe{display:flex;height:10px}.stripe i{flex:1;background:#d4202c}.stripe i:nth-child(2){background:#111}.stripe i:nth-child(3){background:#0b8a4a}
.in{padding:28px 26px 32px}
.logos{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logos img{max-height:64px;max-width:40%;background:#fff;border-radius:8px;padding:2px}
.co{font-size:13px;color:var(--mute);margin:10px 0 18px}
h1{margin:0;font-size:34px;line-height:1.15;font-weight:800}
.ar{font:700 28px/1.3 "IBM Plex Sans Arabic",system-ui,sans-serif;margin:6px 0 20px;color:var(--green)}
.qr{display:inline-block;background:#fff;border:3px solid var(--green);border-radius:20px;padding:14px;line-height:0}
.qr svg{width:min(64vw,330px);height:auto;display:block}
.steps{font-size:14px;color:var(--mute);margin:18px 0 6px}
.url{font:12px ui-monospace,Consolas,monospace;color:var(--mute);word-break:break-all;direction:ltr}
.tools{max-width:560px;margin:14px auto 0;display:flex;gap:10px;justify-content:center}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
@media print{body{background:#fff;padding:0}.tools{display:none}.poster{border:0;max-width:none}h1,.ar{color:#000}.ar{color:#0b6b3a}}
</style>
</head>
<body>
<div class="poster">
  <div class="stripe"><i></i><i></i><i></i></div>
  <div class="in">
    <div class="logos"><img src="logo-amer.png" alt="Amer" onerror="this.style.visibility='hidden'"><img src="logo-truelink.png" alt="True Link" onerror="this.style.visibility='hidden'"></div>
    <div class="co">True Link Government Transaction Center LLC</div>
    <h1>Scan to get your token</h1>
    <div class="ar" dir="rtl">امسح الرمز للحصول على رقم الدور</div>
    <div class="qr" id="qr" role="img" aria-label="QR code for the token request page"></div>
    <div class="steps">1. Scan &nbsp;•&nbsp; 2. Enter your details &nbsp;•&nbsp; 3. Your token appears on your phone</div>
    <div class="url" id="url"></div>
  </div>
  <div class="stripe"><i></i><i></i><i></i></div>
</div>
<div class="tools"><button class="btn" onclick="print()">Print</button><a class="btn g" href="reception.html">Back to reception</a></div>
<script src="qrlib.js"></script>
<script>
const target=new URL("queue.html",location.href).href;
const {QRCode,ECL}=window.QRLib,q=new QRCode(-1,ECL.M);
q.addData(target);q.make();
const n=q.getModuleCount(),Q=4,S=n+Q*2;let d="";
for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+Q} ${r+Q}h1v1h-1z`;
document.getElementById("qr").innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" shape-rendering="crispEdges"><rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
document.getElementById("url").textContent=target;
</script>
</body>
</html>
