<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reception – Token Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#14231c;--mute:#5b6a62;--line:#dde3df;--green:#0b6b3a;--red:#b3202a;--amber:#b36a00;--blue:#1d4f91;--violet:#5b3fa0;--okbg:#e2f0e6;--ambbg:#fbefd9;--redbg:#fbe8e8;--bluebg:#e3ecf7;--vbg:#ece6f7;--soft:#f6f8f7;--shadow:0 1px 2px rgba(16,40,28,.06),0 4px 14px rgba(16,40,28,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1310;--card:#17201b;--ink:#eef3f0;--mute:#9baba2;--line:#2a3730;--okbg:#17301f;--ambbg:#3a2c12;--redbg:#3a1b1d;--bluebg:#172a40;--vbg:#271f3d;--soft:#1b2620;--shadow:none;--green:#2fae6b;--amber:#e0983a;--red:#ef6b73;--blue:#6aa6ea;--violet:#a98ee8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:0 16px 40px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px}
[hidden]{display:none!important}
/* top bar */
.top{background:var(--card);border-bottom:1px solid var(--line);margin:0 -16px 6px;box-shadow:var(--shadow)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 16px}
.top img{height:46px;background:#fff;border-radius:8px;padding:2px}
.ttl{flex:1;text-align:center;line-height:1.25}.ttl b{font-size:17px;display:block}.ttl span{font-size:11px;letter-spacing:.22em;color:var(--mute)}
.stripe{display:flex;height:4px}.stripe i{flex:1;background:#d4202c}.stripe i:nth-child(2){background:#111}.stripe i:nth-child(3){background:#0b8a4a}
/* heading row */
.hd{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between}
h2{font-size:26px;margin:0;font-weight:800;letter-spacing:-.01em}
.live{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.live i{width:8px;height:8px;border-radius:50%;background:#1fa35b;box-shadow:0 0 0 0 rgba(31,163,91,.6);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(31,163,91,0)}100%{box-shadow:0 0 0 0 rgba(31,163,91,0)}}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}.btn.pri:disabled{opacity:.4;cursor:default}
.btn svg{width:15px;height:15px}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);font-size:13px;background:var(--ink);color:var(--card);border-radius:99px;padding:10px 18px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none;text-align:center}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--c);box-shadow:var(--shadow)}
.stat b{font-size:30px;line-height:1.1;display:block;font-weight:800}.stat span{color:var(--mute);font-size:12px;font-weight:600}
/* tabs + search */
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;box-shadow:var(--shadow)}
.tabs button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;font-size:13px;padding:8px 16px;border-radius:8px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--card)}
.tabs em{font-style:normal;font-size:11px;background:var(--line);color:var(--ink);border-radius:99px;padding:1px 8px}
.tabs button[aria-selected=true] em{background:rgba(255,255,255,.22);color:inherit}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:11px 14px 11px 38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
input{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;padding:9px 11px}
/* rows */
.list{display:grid;gap:12px}
.row{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--c,var(--line));border-radius:14px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;box-shadow:var(--shadow)}
.row.w0{--c:var(--blue)}.row.w1{--c:var(--amber)}.row.w2{--c:var(--red)}.row.done{--c:var(--green)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--bluebg);color:var(--blue)}
.row.w1 .av{background:var(--ambbg);color:var(--amber)}.row.w2 .av{background:var(--redbg);color:var(--red)}.row.done .av{background:var(--okbg);color:var(--green)}
.nm{font-size:18px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px}
.chip svg{width:14px;height:14px;color:var(--mute);flex:none}
.chip a{color:var(--ink);text-decoration:none;font-weight:600;text-transform:uppercase}.chip a:hover{text-decoration:underline}
.chip button{border:0;background:var(--line);color:var(--ink);border-radius:5px;font:inherit;font-size:11px;font-weight:700;padding:2px 8px;cursor:pointer}
.chip button:hover{background:var(--ink);color:var(--card)}
.meta{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:12px;color:var(--mute)}
.pill{font-weight:700;border-radius:99px;padding:2px 10px;font-size:11px;letter-spacing:.03em;text-transform:uppercase}
.p-w0{background:var(--bluebg);color:var(--blue)}.p-w1{background:var(--ambbg);color:var(--amber)}.p-w2{background:var(--redbg);color:var(--red)}
.p-done{background:var(--okbg);color:var(--green)}.p-rep{background:var(--vbg);color:var(--violet)}
.oth{color:var(--violet);font-weight:600}
.issue{display:grid;gap:8px;justify-items:end;min-width:230px}
.issue .ir{display:flex;gap:8px;align-items:center}
.issue input.tk{width:150px;font:800 22px ui-monospace,Consolas,monospace;text-transform:uppercase;text-align:center;letter-spacing:.06em;padding:10px 6px;border-width:2px}
.issue input.tk:focus-visible{border-color:var(--green)}
.sent{font:800 28px ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--green);background:var(--okbg);border-radius:10px;padding:4px 14px}
.sm{font-size:12px;min-height:16px;color:var(--mute)}.sm.err{color:var(--red);font-weight:600}
.lnk{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:12px;padding:2px 4px;text-decoration:underline}.lnk:hover{color:var(--red)}
.empty,.err{padding:44px 20px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:14px}.err{color:var(--red)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
#lg{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:340px;margin:12vh auto;padding:24px;display:grid;gap:12px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:auto 1fr}.issue{grid-column:1/-1;justify-items:stretch}.issue .ir{width:100%}.issue input.tk{flex:1;width:auto}.ttl{display:none}.top img{height:38px}.top .in{justify-content:space-between}}
</style>
</head>
<body>
<form id="lg" hidden><b style="font-size:17px">Reception sign-in</b><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn pri" type="submit" style="justify-content:center">Sign in</button><span id="lerr" style="color:var(--red);font-size:13px"></span></form>

<div class="top" id="topbar"><div class="in">
  <img src="logo-amer.png" alt="Amer" onerror="this.style.visibility='hidden'">
  <div class="ttl"><span>TOKEN DESK</span><b>True Link Government Transaction Center LLC</b></div>
  <img src="logo-truelink.png" alt="True Link" onerror="this.style.visibility='hidden'">
</div><div class="stripe"><i></i><i></i><i></i></div></div>

<div class="wrap" id="app">
  <div class="hd">
    <div><h2>Customer queue</h2><div class="live"><i></i><span id="upd">Connecting…</span></div></div>
    <div class="tools">
      <a class="btn" href="qr.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg>Show QR code</a>
      <button class="btn" id="snd" type="button" aria-pressed="true"></button>
      <button class="btn" id="tst" type="button">Test sound</button>
    </div>
  </div>
  <div class="hint" id="sndHint" hidden>Click anywhere on this page once to switch the alert sound on (browser rule).</div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <div class="tabs" role="tablist"><button role="tab" data-tab="waiting" aria-selected="true">Waiting <em id="cw">0</em></button><button role="tab" data-tab="sent" aria-selected="false">Token sent <em id="cs">0</em></button></div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search name, mobile, email or token" aria-label="Search"></div>
  </div>

  <div class="list" id="list"></div>
</div>

<script>
const $=s=>document.querySelector(s);
let items=[],token="",drafts={},sig="",first=true,seen=new Set(),sound=true,tab="waiting",ctx=null;
try{token=sessionStorage.getItem("rk")||"";sound=localStorage.getItem("rsound")!=="off"}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/60000));
const ago=d=>{const m=mins(d);return m<1?"just now":m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"};
const hm=d=>new Date(d).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const shown=p=>String(p).replace(/^0/,""); // display and copy without the leading 0 (0501234567 -> 501234567)
const init=n=>(String(n).trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("")||"?").toUpperCase();
const IC={ph:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
  ml:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  ck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  sp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'};

async function api(p,body){
  const h={"Content-Type":"application/json",Authorization:"Bearer "+token};
  const r=await fetch("/api/"+p,body?{method:"POST",headers:h,body:JSON.stringify(body)}:{headers:h,cache:"no-store"});
  if(r.status===401&&p!=="reception/login"){$("#app").hidden=true;$("#topbar").hidden=true;$("#lg").hidden=false;throw new Error("auth")}
  if(!r.ok){const e=new Error(r.status);try{e.code=(await r.json()).error}catch(x){}throw e}
  return r.json();
}

/* ---------- loud alert sound ---------- */
function audio(){if(!ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)ctx=new A()}return ctx}
function hint(){$("#sndHint").hidden=!(sound&&(!ctx||ctx.state!=="running"))}
function unlock(){const c=audio();if(c&&c.state==="suspended")c.resume().then(hint);else hint()}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function beep(){
  if(!sound)return;const c=audio();if(!c)return;if(c.state==="suspended")c.resume();
  const t0=c.currentTime;
  // four sharp square-wave bursts at full volume: much louder than a soft sine beep
  [[880,0],[1320,.3],[880,.6],[1320,.9]].forEach(([fr,d])=>{
    const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=fr;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(1,t0+d+.015);g.gain.setValueAtTime(1,t0+d+.2);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.26);
    o.start(t0+d);o.stop(t0+d+.28);
  });
}
function sndLabel(){const b=$("#snd");b.innerHTML=IC.sp+"Sound: "+(sound?"on":"off");b.setAttribute("aria-pressed",sound);hint()}
$("#snd").onclick=()=>{sound=!sound;try{localStorage.setItem("rsound",sound?"on":"off")}catch(e){}unlock();sndLabel();if(sound)beep()};
$("#tst").onclick=()=>{unlock();const s=sound;sound=true;beep();sound=s};

/* ---------- data ---------- */
async function load(){
  try{
    items=(await api("reception/list")).items;$("#lg").hidden=true;$("#topbar").hidden=false;$("#app").hidden=false;
    const w=items.filter(i=>i.status==="waiting");
    if(!first&&w.some(i=>!seen.has(i.id)))beep();
    w.forEach(i=>seen.add(i.id));first=false;
    $("#upd").textContent="Live · updated "+new Date().toLocaleTimeString("en-GB");
    const s=JSON.stringify(items.map(i=>[i.id,i.status,i.token]));
    if(s!==sig){sig=s;render()}else tick();
  }catch(e){if(e.message==="auth")return;$("#upd").textContent="Connection problem. Retrying…";if(first)$("#list").innerHTML='<div class="err">Could not load the queue. Check that the site was deployed with the server function.</div>'}
}
function groups(){const g={};items.forEach(i=>(g[i.phone]=g[i.phone]||[]).push(i));Object.values(g).forEach(a=>a.sort((x,y)=>x.createdAt.localeCompare(y.createdAt)));return g}
function tick(){
  const w=items.filter(i=>i.status==="waiting"),G=groups();
  const longest=w.length?ago(w.reduce((a,b)=>a.createdAt<b.createdAt?a:b).createdAt):"–";
  const st=[["var(--amber)",w.length,"Waiting now"],["var(--green)",items.length-w.length,"Tokens sent"],["var(--blue)",Object.keys(G).length,"Customers today"],["var(--red)",longest,"Longest wait"]];
  $("#stats").innerHTML=st.map(([c,v,l])=>`<div class="stat" style="--c:${c}"><b>${esc(v)}</b><span>${l}</span></div>`).join("");
  $("#cw").textContent=w.length;$("#cs").textContent=items.length-w.length;
  document.querySelectorAll(".ago").forEach(e=>e.textContent=ago(e.dataset.t));
}
function row(i,G){
  const w=i.status==="waiting",m=mins(i.createdAt),lvl=w?(m>=10?2:m>=5?1:0):"",
    arr=G[i.phone]||[i],n=arr.findIndex(x=>x.id===i.id)+1,oth=arr.filter(x=>x.id!==i.id&&x.token).map(x=>x.token),
    v=drafts[i.id]!==undefined?drafts[i.id]:(i.token||"");
  const pill=w?`<span class="pill p-w${lvl}">${lvl===2?"Long wait":"Waiting"}</span>`:`<span class="pill p-done">Token sent</span>`;
  const rep=arr.length>1?`<span class="pill p-rep">Request ${n} of ${arr.length}</span>`:"";
  return `<div class="row ${w?"w"+lvl:"done"}" data-id="${i.id}">
    <div class="av" aria-hidden="true">${esc(init(i.name))}</div>
    <div>
      <div class="nm" dir="auto">${esc(i.name)} ${pill} ${rep}</div>
      <div class="chips">
        <span class="chip">${IC.ph}<a href="tel:${esc(i.phone)}" dir="ltr">${esc(shown(i.phone))}</a><button type="button" data-copy="${esc(shown(i.phone))}">Copy</button></span>
        <span class="chip">${IC.ml}<a href="mailto:${esc(i.email)}" dir="ltr">${esc(i.email)}</a><button type="button" data-copy="${esc(i.email)}">Copy</button></span>
        <span class="chip"><a>${esc(i.name)}</a><button type="button" data-copy="${esc(i.name)}">Copy name</button></span>
      </div>
      <div class="meta"><span style="display:inline-flex;gap:5px;align-items:center"><span style="width:14px;height:14px;display:inline-block">${IC.ck}</span>Arrived ${hm(i.createdAt)}${w?` · waiting <span class="ago" data-t="${i.createdAt}">${ago(i.createdAt)}</span>`:` · token sent ${hm(i.issuedAt)}`}</span>${oth.length?`<span class="oth">Other tokens today: ${oth.map(esc).join(", ")}</span>`:""}${i.language==="ar"?"<span>Arabic</span>":""}</div>
    </div>
    <div class="issue">
      ${w?"":`<div class="sent" dir="ltr">${esc(i.token)}</div>`}
      <div class="ir"><input class="tk" dir="ltr" maxlength="20" placeholder="TOKEN" aria-label="Token number" value="${esc(v)}"><button class="btn pri send" type="button" ${v.trim()?"":"disabled"}>${w?"Send token":"Update"}</button></div>
      <div><button class="lnk del" type="button">Remove</button> <span class="sm" role="status"></span></div>
    </div></div>`;
}
function render(){
  const q=$("#q").value.trim().toLowerCase(),G=groups();
  const m=i=>!q||(i.name+" "+i.phone+" "+shown(i.phone)+" "+i.email+" "+i.token).toLowerCase().includes(q);
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const list=tab==="waiting"
    ?items.filter(i=>i.status==="waiting"&&m(i)).sort((a,b)=>a.createdAt.localeCompare(b.createdAt))
    :items.filter(i=>i.status==="issued"&&m(i)).sort((a,b)=>b.issuedAt.localeCompare(a.issuedAt)).slice(0,80);
  $("#list").innerHTML=list.length?list.map(i=>row(i,G)).join(""):
    tab==="waiting"?'<div class="empty"><b>No customers waiting</b>New requests appear here automatically.</div>':'<div class="empty"><b>No tokens sent yet</b>Tokens you send will be listed here.</div>';
  tick();
}
async function send(box){
  const id=box.dataset.id,inp=box.querySelector("input.tk"),btn=box.querySelector(".send"),sm=box.querySelector(".sm");
  const t=inp.value.trim().toUpperCase();if(!t)return;
  btn.disabled=true;sm.className="sm";sm.textContent="Sending…";
  try{
    const r=await api("reception/issue",{id,token:t});
    items=items.map(x=>x.id===id?r.item:x);delete drafts[id];sig=JSON.stringify(items.map(i=>[i.id,i.status,i.token]));render();
  }catch(e){
    if(e.message==="auth")return;
    sm.className="sm err";btn.disabled=false;
    sm.textContent=e.code==="badtoken"?"Use letters, numbers and dashes only.":e.code==="notfound"?"Customer record no longer exists.":"Could not send. Try again.";
  }
}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();return}
  const c=e.target.closest("[data-copy]");
  if(c){const v=c.dataset.copy;try{await navigator.clipboard.writeText(v)}catch(x){const ta=document.createElement("textarea");ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(y){}ta.remove()}
    const o=c.textContent;c.textContent="Copied ✓";setTimeout(()=>c.textContent=o,1200);return}
  const box=e.target.closest(".row");if(!box)return;
  if(e.target.closest(".send"))return send(box);
  if(e.target.closest(".del")&&confirm("Remove this request from the queue? The customer's phone will ask them to submit again.")){
    try{await api("reception/delete",{id:box.dataset.id});items=items.filter(x=>x.id!==box.dataset.id);sig="";render()}catch(x){if(x.message!=="auth")alert("Could not remove. Try again.")}
  }
});
document.addEventListener("input",e=>{
  if(e.target.matches("input.tk")){
    // always show token in capital letters; ignore characters the ERP token cannot contain
    const el=e.target,pos=el.selectionStart,old=el.value,nv=old.toUpperCase().replace(/[^A-Z0-9\- ]/g,"");
    if(nv!==old){el.value=nv;const p=Math.max(0,pos-(old.length-nv.length));try{el.setSelectionRange(p,p)}catch(x){}}
    const box=el.closest(".row");drafts[box.dataset.id]=nv;box.querySelector(".send").disabled=!nv.trim();
  }
  if(e.target.id==="q")render();
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("input.tk")){e.preventDefault();send(e.target.closest(".row"))}});
$("#lg").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";try{const r=await api("reception/login",{password:$("#pw").value});token=r.token;try{sessionStorage.setItem("rk",token)}catch(x){}first=true;load()}catch(x){$("#lerr").textContent="Wrong password."}};
sndLabel();load();
setInterval(load,5000);
setInterval(()=>{ // keep wait-time colours and timers fresh without disturbing typing
  if(document.activeElement&&document.activeElement.matches("input"))document.querySelectorAll(".ago").forEach(e=>e.textContent=ago(e.dataset.t));else render();
},30000);
</script>
